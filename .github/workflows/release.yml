name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            executable: ./happy-memory
          - runner: ubuntu-24.04-arm
            executable: ./happy-memory
          - runner: macos-15-intel
            executable: ./happy-memory
          - runner: macos-14
            executable: ./happy-memory
          - runner: windows-latest
            executable: .\happy-memory.exe
          - runner: windows-11-arm
            executable: .\happy-memory.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build native binary
        run: go build -trimpath -o happy-memory${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/happy-memory
      - name: Run native binary
        shell: pwsh
        run: |
          $result = & "${{ matrix.executable }}" version | ConvertFrom-Json
          if (-not $result.ok -or $result.data.version -ne "dev") { throw "version smoke test failed" }
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-installers.ps1

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate immutable SemVer tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; refusing to replace it" >&2
            exit 1
          fi
      - run: make check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
